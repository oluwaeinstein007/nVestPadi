# Litestream: continuous SQLite replication to S3-compatible storage.
# Only used when LITESTREAM_BUCKET is set (see docker-entrypoint.sh). Values come from the environment;
# credentials are read from LITESTREAM_ACCESS_KEY_ID / LITESTREAM_SECRET_ACCESS_KEY.
dbs:
  - path: ${DATABASE_PATH}
    replicas:
      - type: s3
        bucket: ${LITESTREAM_BUCKET}
        path: ${LITESTREAM_PATH}
        endpoint: ${LITESTREAM_ENDPOINT}
        region: ${LITESTREAM_REGION}
        sync-interval: 1s
